<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="hud">
      <h1>Breakout</h1>
      <div class="stats">
        <span>Score <strong id="score">0</strong></span>
        <span>Lives <strong id="lives">3</strong></span>
        <span>Level <strong id="level">1</strong></span>
        <span class="mode" id="mode">Human</span>
      </div>
    </header>
    <canvas id="game" aria-label="Breakout game board"></canvas>
    <p class="help">
      <kbd>←</kbd>/<kbd>→</kbd> or <kbd>A</kbd>/<kbd>D</kbd> or mouse to move ·
      <kbd>Space</kbd>/click to launch · <kbd>P</kbd> pause · <kbd>R</kbd> restart
    </p>
  </main>
  <script src="engine.js"></script>
  <script src="main.js"></script>
</body>
</html>
